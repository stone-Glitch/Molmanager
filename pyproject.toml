[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molmanager"
version = "1.2.0"
description = "MolManager · 分子管理器：计算产物归档、批量格式转换、PSI4 量化计算与分子检索"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "stone-Glitch" }]
keywords = ["chemistry", "psi4", "openbabel", "tkinter", "cheminformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pydantic>=2.0",        # utils/config.py 配置模型校验
    "numpy",                # 数值计算
    "scipy",                # 构象对齐 / 统计
    "matplotlib",           # 轨道能级图、分析图表
    "pillow",               # 2D 结构图后处理
    "psutil",               # 子进程管理
    "packaging",            # 版本号比较（缺失时自动降级）
]

[project.optional-dependencies]
# FastAPI 接口层（api/）
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# 可选：改用 RDKit 指纹（默认走 OpenBabel FP2，无需安装）
rdkit = ["rdkit>=2024.3.1"]
# 开发：测试 / 格式化 / 类型检查
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
molmanager = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "ui*", "chem*", "utils*", "api*"]
# 排除全角命名的运维脚本（更新.py）与任何构建产物
exclude = ["tests*", "build*", "dist*", "更新*"]

[tool.setuptools.package-data]
"ui.dialogs" = ["*.json"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["更新.py", "*.bak", ".git"]

[tool.ruff.lint]
# 只开「确定是错误」的规则，避免一次性引入上千条风格整改噪音。
# 真正有价值的是 F821（未定义名称，拆分事故就栽在这）与 I001（导入排序）。
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E402",   # 模块级 import 不在顶部：utils/path_utils.py 等处是有意的延迟导入
    "E501",   # 行宽：中英混排 + 长中文注释，交给 ruff format 处理
    "E701",   # 一行多语句（冒号）：紧凑的 if/elif 赋值表，纯风格
    "E702",   # 一行多语句（分号）：同上
    "E741",   # 模糊变量名 l/I/O：化学代码里惯用 l 表示键长、I 表示强度
    "F403",   # from x import *（子包 re-export 用）
    "F405",
    "F841",   # 局部变量赋值未使用：历史遗留的预留变量，逐个清理收益低、风险高
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui", "chem", "utils", "api"]

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "requires_openbabel: 需要 OpenBabel 环境（CI 上自动跳过）",
    "requires_psi4: 需要 PSI4 环境（CI 上自动跳过）",
    "requires_gui: 需要 Tkinter 显示环境",
]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
exclude = ["更新.py", "build/"]
